<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174a82" />
    <title>Offline - SIMA Aset</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f8fafc; color: #1e293b; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
      main { max-width: 420px; }
      h1 { margin: 0 0 8px; color: #174a82; font-size: 1.5rem; }
      p { margin: 0 0 20px; color: #475569; }
      button { padding: 10px 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Anda sedang offline</h1>
      <p>Halaman belum tersimpan di perangkat. Periksa koneksi internet, lalu coba lagi.</p>
      <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
